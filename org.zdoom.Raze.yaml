app-id: org.zdoom.Raze
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
runtime-version: '26.08'
command: raze.sh

finish-args:
# Controller support on SteamDeck and such (copied from GZDoom)
  - --device=all
  - --socket=x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio

# Based on Raze
# We redirect the original ~/.config/raze
  - --persist=.config/raze

# Simpler way of preventing KDE related errors
  - --env=KDE_FULL_SESSION=false

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'

modules:

  - shared-modules/linux-audio/libinstpatch.json
  - shared-modules/linux-audio/fluidsynth2.json

  - name: game-music-emu
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/libgme/game-music-emu/archive/refs/tags/0.6.5.tar.gz
        sha256: 8531678502451c2cf04248cda45c8b4645e19fcfb63e6a7ec2549641c47bb392
        x-checker-data:
          type: anitya
          project-id: 866
          stable-only: true
          url-template: https://github.com/libgme/game-music-emu/archive/refs/tags/$version.tar.gz

  - name: zmusic
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/UZDoom/ZMusic/archive/1.3.0.tar.gz
        sha256: 2eccd41e1cc9b38b3729ab94d65635719b2adc916de4ca9f8399ebceaee89f7f
        x-checker-data:
          type: anitya
          project-id: 153600
          stable-only: true
          url-template: https://github.com/UZDoom/ZMusic/archive/$version.tar.gz

  - name: raze
    buildsystem: cmake-ninja
    build-options:
      cflags: -std=gnu17 -Wno-error=old-style-definition
      cxxflags: -include cstdint
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DSYSTEMINSTALL=1
    post-install:
      - install -Dm644 soundfont/raze.sf2 -t /app/share/games/raze/soundfonts/
      - install -Dm755 raze.sh -t /app/bin/
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/ZDoom/Raze.git
        tag: 1.11.0
        commit: 19e5f308de065fb432beb9d11070ece12da3ea3c
      - type: script
        commands:
          - raze +fluid_patchset /app/share/games/raze/soundfonts/raze.sf2 "$@"
        dest-filename: raze.sh
      - type: file
        path: org.zdoom.Raze.desktop
      - type: file
        path: org.zdoom.Raze.metainfo.xml
      - type: file
        path: org.zdoom.Raze.png
